<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gigapub Ad</title>
</head>
<body style="background:transparent; margin:0; padding:0;">
  <script>
    function triggerAd() {
      try {
        // Purana koi script ho toh hata dein
        var oldScript = document.getElementById('giga-script');
        if (oldScript) {
          oldScript.remove();
        }

        // Naya Gigapub Script dynamically inject karna taaki ad load ho sake
        var script = document.createElement('script');
        script.id = 'giga-script';
        script.src = 'https://ad.gigapub.tech/script?id=8575';
        
        script.onload = function() {
          // Success signal parent window ko bhejna
          window.parent.postMessage({ type: 'GIGAPUB_SUCCESS' }, '*');
        };

        script.onerror = function(err) {
          window.parent.postMessage({ type: 'GIGAPUB_FAIL', error: err }, '*');
        };

        document.body.appendChild(script);

      } catch(e) {
        window.parent.postMessage({ type: 'GIGAPUB_FAIL', error: e }, '*');
      }
    }

    window.addEventListener('message', function(event) {
      if (event.data && event.data.type === 'START_GIGAPUB') {
        triggerAd();
      }
    });
  </script>
</body>
</html>
