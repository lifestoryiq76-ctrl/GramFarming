<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gigapub Ad</title>
  <script src="https://ad.gigapub.tech/script?id=8575"></script>
</head>
<body style="background:transparent; margin:0; padding:0;">
  <script>
    function triggerAd() {
      try {
        var showGigaFn = window.showGiga || (window.Gigapub && window.Gigapub.show) || window.show_gigapub;
        if (typeof showGigaFn === 'function') {
          showGigaFn().then(function() {
            window.parent.postMessage({ type: 'GIGAPUB_SUCCESS' }, '*');
          }).catch(function(err) {
            window.parent.postMessage({ type: 'GIGAPUB_FAIL', error: err }, '*');
          });
        } else {
          window.parent.postMessage({ type: 'GIGAPUB_NOT_READY' }, '*');
        }
      } catch(e) {
        window.parent.postMessage({ type: 'GIGAPUB_FAIL', error: e }, '*');
      }
    }

    window.addEventListener('message', function(event) {
      if (event.data && event.data.type === 'START_GIGAPUB') {
        triggerAd();
      }
    });
  </script>
</body>
</html>
