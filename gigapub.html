<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gigapub Ad</title>
</head>
<body style="background:transparent; margin:0; padding:0;">
  <script>
    function triggerAd() {
      try {
        var oldScript = document.getElementById('giga-script');
        if (oldScript) oldScript.remove();

        var script = document.createElement('script');
        script.id = 'giga-script';
        script.src = 'https://ad.gigapub.tech/script?id=8575';

        script.onload = function() {
          // Script load hote hi parent ko signal bhejein
          window.parent.postMessage({ type: 'GIGAPUB_SUCCESS' }, '*');
        };

        script.onerror = function(err) {
          window.parent.postMessage({ type: 'GIGAPUB_FAIL', error: err }, '*');
        };

        document.body.appendChild(script);

        // Fallback: 2.5s me parent overlay ko hide karke ad visibility allow karein
        setTimeout(function() {
          window.parent.postMessage({ type: 'GIGAPUB_SUCCESS' }, '*');
        }, 2500);

      } catch(e) {
        window.parent.postMessage({ type: 'GIGAPUB_FAIL', error: e }, '*');
      }
    }

    window.addEventListener('message', function(event) {
      if (event.data && event.data.type === 'START_GIGAPUB') {
        triggerAd();
      }
    });
  </script>
</body>
</html>
