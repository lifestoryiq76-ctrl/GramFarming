<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gram Farming Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            background: #1e293b;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            width: 90%;
            max-width: 400px;
        }
        h1 { color: #38bdf8; font-size: 24px; }
        .balance { font-size: 32px; font-weight: bold; margin: 20px 0; color: #4ade80; }
        button {
            background-color: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 12px 24px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }
        button:active { background-color: #0ea5e9; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Gram Farming</h1>
        <p>Your Balance</p>
        <div class="balance" id="balance">0 GRAM</div>
        <button onclick="earnPoints()">Farm +1 Point</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Telegram user info (fallback to test user if opened outside telegram)
        const user = tg.initDataUnsafe?.user || { id: "123456789", username: "test_user" };
        const telegramId = user.id.toString();
        const username = user.username || "player";

        // Apna Render wala backend URL yahan dalein (jaise: https://gramfarming.onrender.com)
        const BACKEND_URL = "YOUR_RENDER_BACKEND_URL";

        // Fetch User Data on Load
        async function fetchUser() {
            try {
                const response = await fetch(`${BACKEND_URL}/api/user`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ telegramId, username })
                });
                const data = await response.json();
                if (data.success) {
                    document.getElementById('balance').innerText = `${data.user.balance} GRAM`;
                }
            } catch (err) {
                console.error('Error fetching user:', err);
            }
        }

        // Earn Points Function
        async function earnPoints() {
            try {
                const response = await fetch(`${BACKEND_URL}/api/update-balance`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ telegramId, pointsToAdd: 1 })
                });
                const data = await response.json();
                if (data.success) {
                    document.getElementById('balance').innerText = `${data.newBalance} GRAM`;
                }
            } catch (err) {
                console.error('Error updating balance:', err);
            }
        }

        fetchUser();
    </script>
</body>
</html>
