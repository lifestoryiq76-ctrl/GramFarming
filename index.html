      const currentTime = Date.now();

      if (activeSession) {
        try {
          const sessionData = JSON.parse(activeSession);
          if (currentTime - sessionData.timestamp < 5000 && sessionData.token !== currentSessionToken) {
            document.body.innerHTML = `
              <div style="display: flex; justify-content: center; align-items: center; height: 100vh; background: #0f172a; color: #fff; text-align: center; padding: 20px; font-family: sans-serif;">

                  <h2 style="color: #ef4444; margin-top: 0;">⚠️ Multiple Instances Restricted</h2>
                  <p style="color: #94a3b8; font-size: 14px; line-height: 1.6;">
                    Yeh Mini App is device par pehle se kisi aur tab ya window me open hai. Aap ek device par ek waqt me sirf ek hi instance open kar sakte hain!
                  </p>
                  <button onclick="location.reload()" style="background: #22c55e; color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 15px; width: 100%;">Retry / Refresh</button>
                </div>
              </div>
            `;
            return;
          }
        } catch(e) {}
      }

      localStorage.setItem(SESSION_KEY, JSON.stringify({ token: currentSessionToken, timestamp: currentTime }));
      setInterval(() => {
        localStorage.setItem(SESSION_KEY, JSON.stringify({ token: currentSessionToken, timestamp: Date.now() }));
      }, 2000);
    });

    const firebaseConfig = {
      apiKey: "AIzaSyCx2g_tueJ0tqghMMlh4z20ltA_UlLe_Hg",

        const data = snapshot.val();

          let lblBonus = document.getElementById('lblDailyBonus');
          if (lblBonus) lblBonus.innerText = `${currentDailyBonus} Coins`;
          let bonusDisp = document.getElementById('dailyBonusDisplay');
          if (bonusDisp) bonusDisp.innerText = currentDailyBonus.toFixed(2);
        }
        if (data.minWithdrawal !== undefined) {
          minWithdrawalAmt = parseFloat(data.minWithdrawal);
          let lblMin = document.getElementById('lblMinWithdraw');
          if (lblMin) lblMin.innerText = `${minWithdrawalAmt} Coins`;
        }
        if (data.refBonus !== undefined) {
          currentRefBonusPercent = parseFloat(data.refBonus);
        }
        renderUIValues();
        calculateExchange();
      }
    });

    window.changeLanguage = function(lang) {
      const dict = translations[lang] || translations['en'];
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (dict[key]) el.innerText = dict[key];
      });
      toggleWithdrawFields();
    }

    const tg = window.Telegram.WebApp;
    tg.expand();

    let displayName = "👑 My Account";
    let userId = "12345";
    let startParam = "";

    if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
      let user = tg.initDataUnsafe.user;
      let fullName = `${user.first_name || ''} ${user.last_name || ''}`.trim();
      displayName = `👑 ${fullName}` + (user.username ? ` (@${user.username})` : '');
      userId = String(user.id);
    }

    if (tg.initDataUnsafe && tg.initDataUnsafe.start_param) {
      startParam = tg.initDataUnsafe.start_param;
    }

    let userEl = document.getElementById('telegramUserName');
    if (userEl) userEl.innerText = displayName;

    // --- LOAD USER DATA & HANDLE REFERRAL ---
    const userRef = ref(db, 'users/' + userId);
    
    get(child(ref(db), 'users/' + userId)).then((snapshot) => {
      if (!snapshot.exists()) {
        let referrerId = null;
        if (startParam && startParam.startsWith('ref_')) {
          referrerId = startParam.replace('ref_', '');
        }

        if (referrerId && referrerId !== userId) {
          const inviterRef = ref(db, 'users/' + referrerId);
          get(inviterRef).then((invSnapshot) => {
            if (invSnapshot.exists()) {
              let invData = invSnapshot.val();
              let newInvitedCount = (invData.totalInvited || 0) + 1;
              update(inviterRef, { totalInvited: newInvitedCount });
            }
          });
        }

        set(userRef, {
          name: displayName,
          balance: 0.00,
          tonBalance: 0.00,
          usdtBalance: 0.00,
          refReward: 0.00,
          totalInvited: 0,
          savedTonAddress: "",
          referredBy: referrerId || "none",
          homeAdsgramLimit: 40,
          taskAdsgramLimit: 40,
          taskMonetagLimit: 40,
          taskGigapubLimit: 40
        });
      }
    });

    onValue(userRef, (snapshot) => {
      const data = snapshot.val();
      if (data) {
        balance = data.balance || 0.00;
        tonBalance = data.tonBalance || 0.00;
        usdtBalance = data.usdtBalance || 0.00;
        refReward = data.refReward || 0.00;
        totalInvited = data.totalInvited || 0;
        savedTonAddress = data.savedTonAddress || "";

        if (data.homeAdsgramLimit !== undefined) adLimits.homeAdsgramLimit = data.homeAdsgramLimit;
        if (data.taskAdsgramLimit !== undefined) adLimits.taskAdsgramLimit = data.taskAdsgramLimit;
        if (data.taskMonetagLimit !== undefined) adLimits.taskMonetagLimit = data.taskMonetagLimit;
        if (data.taskGigapubLimit !== undefined) adLimits.taskGigapubLimit = data.taskGigapubLimit;
      }
      renderUIValues();
      toggleWithdrawFields();
    });

    function saveToFirebase() {
      update(userRef, {
        balance: balance,
        tonBalance: tonBalance,
        usdtBalance: usdtBalance,
        refReward: refReward,
        totalInvited: totalInvited,
        savedTonAddress: savedTonAddress,
        homeAdsgramLimit: adLimits.homeAdsgramLimit,
        taskAdsgramLimit: adLimits.taskAdsgramLimit,
        taskMonetagLimit: adLimits.taskMonetagLimit,
        taskGigapubLimit: adLimits.taskGigapubLimit
      });
    }

    // --- DYNAMIC REFERRAL COMMISSION ---
    function addEarningsWithReferral(earnedAmount) {
      balance += earnedAmount;
      
      get(userRef).then((snapshot) => {
        if (snapshot.exists() && snapshot.val().referredBy && snapshot.val().referredBy !== "none") {
          let inviterId = snapshot.val().referredBy;
          let inviterRef = ref(db, 'users/' + inviterId);
          get(inviterRef).then((invSnap) => {
            if (invSnap.exists()) {
              let currentRefReward = invSnap.val().refReward || 0;
              let commission = earnedAmount * (currentRefBonusPercent / 100);
              update(inviterRef, { refReward: currentRefReward + commission });
            }
          });
        }
      });

      saveToFirebase();
      renderUIValues();
    }

    window.saveTonAddress = function() {
      let addrInput = document.getElementById('manualTonAddress');
      if (!addrInput) return;
      let addrVal = addrInput.value.trim();
      if (!addrVal || addrVal.length < 15) {
        alert("Kripya ek valid TON wallet address enter karein.");
        return;
      }
      savedTonAddress = addrVal;
      saveToFirebase();
      addrInput.value = savedTonAddress;
      addrInput.readOnly = true;
      alert("✅ TON Wallet address successfully save ho gaya hai!");
      toggleWithdrawFields();
    }

    window.disconnectTonAddress = function() {
      if (confirm("Kya aap apna wallet address disconnect karna chahte hain?")) {
        savedTonAddress = "";
        saveToFirebase();
        let addrInput = document.getElementById('manualTonAddress');
        if (addrInput) {
          addrInput.value = "";
          addrInput.readOnly = false;
        }
        alert("🔄 Wallet successfully disconnect ho gaya hai.");
        toggleWithdrawFields();
      }
    }

    async function fetchLiveTonPrice() {
      try {
        let response = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=the-open-network&vs_currencies=usd');
        let data = await response.json();
        if(data && data['the-open-network'] && data['the-open-network'].usd) {
          liveTonPrice = data['the-open-network'].usd;
          let rateStatus = document.getElementById('liveRateStatus');
          if (rateStatus) rateStatus.innerText = `📡 Live TON Rate: $${liveTonPrice} USDT (Real-time)`;
          calculateExchange();
          return;
        }
      } catch (error) {}

      try {
        let backupResponse = await fetch('https://api.binance.com/api/v3/ticker/price?symbol=TONUSDT');
        let backupData = await backupResponse.json();
        if(backupData && backupData.price) {
          liveTonPrice = parseFloat(backupData.price);
          let rateStatus = document.getElementById('liveRateStatus');
          if (rateStatus) rateStatus.innerText = `📡 Live TON Rate: $${liveTonPrice.toFixed(2)} USDT (Binance)`;
          calculateExchange();
          return;
        }
      } catch (error) {
        let rateStatus = document.getElementById('liveRateStatus');
        if (rateStatus) rateStatus.innerText = `📡 TON Rate: $${liveTonPrice} USDT (Fallback)`;
      }
    }

    function renderUIValues() {
      const setElText = (id, text) => { let el = document.getElementById(id); if(el) el.innerText = text; };

      setElText('userBalance', balance.toFixed(2));
      setElText('walletCoinDisplay', balance.toFixed(2));
      setElText('tonBalance', tonBalance.toFixed(4));
      setElText('usdtBalance', usdtBalance.toFixed(4));
      setElText('refRewardBalance', `+${refReward.toFixed(2)} 🪙`);
      setElText('totalInvitedCount', `${totalInvited} USERS`);
      setElText('rankBalance', `${balance.toFixed(2)}`);
      setElText('displayCoinVolume', `1 Coin = $${coinUsdtValue}`);
      
      let manInput = document.getElementById('manualTonAddress');
      if (manInput) {
        if (savedTonAddress) {
          manInput.value = savedTonAddress;
          manInput.readOnly = true;
        } else {
          manInput.value = "";
          manInput.readOnly = false;
        }
      }

      let methodEl = document.getElementById('withdrawMethod');
      let method = methodEl ? methodEl.value : 'ton';
      let availVal = (method === 'ton') ? tonBalance : usdtBalance;
      setElText('availableWithdrawBalance', `Available: ${availVal.toFixed(4)}`);
    }
    
    fetchLiveTonPrice();
    setInterval(fetchLiveTonPrice, 60000);

    window.switchTab = function(tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
      let targetTab = document.getElementById(tabId);
      if (targetTab) targetTab.classList.add('active');
    }

    window.toggleTaskTab = function(subTab) {
      let adsTasksEl = document.getElementById('adsTasks');
      let userTasksEl = document.getElementById('userTasks');
      if(subTab === 'adsTasks') {
        if (adsTasksEl) adsTasksEl.style.display = 'block';
        if (userTasksEl) userTasksEl.style.display = 'none';
      } else {
        if (adsTasksEl) adsTasksEl.style.display = 'none';
        if (userTasksEl) userTasksEl.style.display = 'block';
      }
    }

    window.toggleMiningBoxes = function() {
      let section = document.getElementById('miningBoxesSection');
      let arrow = document.getElementById('miningArrow');
      if (!section || !arrow) return;
      if (section.classList.contains('show')) {
        section.classList.remove('show');
        arrow.innerText = '▼';
      } else {
        section.classList.add('show');
        arrow.innerText = '▲';
      }
    }

    let AdController = null;
    try { AdController = window.Adsgram.init({ blockId: "YOUR_ADSGRAM_BLOCK_ID" }); } catch(e) {}

    window.watchAdWithTimer = function(reward, adName, limitElementId, btnElementId) {
      let limitKey = limitElementId || 'homeAdsgramLimit';
      let currentLimit = adLimits[limitKey] !== undefined ? adLimits[limitKey] : 40;
      
      if (currentLimit <= 0) {
        alert("Daily ad limit reached for today!");
        return;
      }

      let btn = btnElementId ? document.getElementById(btnElementId) : null;
      if (btn) btn.disabled = true;

      let playAdLogic = () => {
        if (adName === 'Adsgram' && AdController) {
          AdController.show().then(() => {
            completeAdReward(reward, limitKey, btn, currentLimit);
          }).catch(() => { 
            alert("Ad skipped."); 
            if (btn) btn.disabled = false;
          });
        } else {
          completeAdReward(reward, limitKey, btn, currentLimit);
        }
      };
      playAdLogic();
    }

    function completeAdReward(reward, limitKey, btn, currentLimit) {
      addEarningsWithReferral(reward);
      currentLimit--;
      adLimits[limitKey] = currentLimit;
      saveToFirebase();
      let limitEl = document.getElementById(limitKey);
      if (limitEl) limitEl.innerText = `${currentLimit} left`;
      alert(`+${reward} Coin added successfully!`);

      if (btn) {
        let cooldown = 5;
        btn.innerText = `Wait ${cooldown}s`;
        let timerInterval = setInterval(() => {
          cooldown--;
          btn.innerText = `Wait ${cooldown}s`;
          if (cooldown <= 0) {
            clearInterval(timerInterval);
            btn.innerText = "Watch";
            btn.disabled = false;
          }
        }, 1000);
      }
    }

    window.claimDailyBonus = function() {
      let lastClaimDate = localStorage.getItem('last_bonus_date_' + userId);
      let todayStr = new Date().toDateString();
      if(lastClaimDate === todayStr) { alert("Daily bonus already claimed today!"); return; }

      let verifyAndClaim = () => {
        localStorage.setItem('last_bonus_date_' + userId, todayStr);
        addEarningsWithReferral(currentDailyBonus);
        alert(`🎁 Daily bonus claimed! +${currentDailyBonus.toFixed(2)} Coins added.`);
      };

      if (AdController) {
        AdController.show().then(() => {
          verifyAndClaim();
        }).catch(() => {
          alert("Ad skipped. Please watch the ad to claim daily bonus.");
        });
      } else {
        verifyAndClaim();
      }
    }

    const treeStates = [
      { adsWatched: 0, limit: 20, status: 'ads' },
      { adsWatched: 0, limit: 20, status: 'ads' },
      { adsWatched: 0, limit: 20, status: 'ads' },
      { adsWatched: 0, limit: 20, status: 'ads' }
    ];

    window.handleTreeAction = function(index, treeName, adType, totalDurationSec) {
      let state = treeStates[index];
      let btn = document.getElementById(`treeBtn-${index}`);
      
      if (state.status === 'ads') {
        if (btn) btn.disabled = true;
        let playAd = () => {
          if (adType === 'Adsgram' && AdController) {
            AdController.show().then(() => {
              processTreeAdStep(index, treeName, adType, totalDurationSec);
            }).catch(() => {
              alert("Ad skipped.");
              if (btn) btn.disabled = false;
            });
          } else {
            processTreeAdStep(index, treeName, adType, totalDurationSec);
          }
        };
        playAd();
      } else if (state.status === 'mining') {
        alert("Mining is already in progress!");
      } else if (state.status === 'claim') {
        claimTreeReward(index, treeName, totalDurationSec);
      }
    }

    function processTreeAdStep(index, treeName, adType, totalDurationSec) {
      let state = treeStates[index];
      let btn = document.getElementById(`treeBtn-${index}`);
      let statusEl = document.getElementById(`treeStatus-${index}`);
      let limitElId = [`pineLimit`, `appleLimit`, `sakuraLimit`, `crystalLimit`][index];
      let limitEl = document.getElementById(limitElId);

      state.adsWatched++;
      state.limit--;
      if (limitEl) limitEl.innerText = `${state.limit} left`;

      if (state.adsWatched < 20) {
        if (statusEl) statusEl.innerHTML = `Watched ${state.adsWatched}/20 Ads`;
        let cooldown = 5;
        if (btn) btn.innerText = `Wait ${cooldown}s`;
        let tInterval = setInterval(() => {
          cooldown--;
          if (btn) btn.innerText = `Wait ${cooldown}s`;
          if (cooldown <= 0) {
            clearInterval(tInterval);
            if (btn) {
              btn.innerText = `Watch Ad (${state.adsWatched + 1}/20)`;
              btn.disabled = false;
            }
          }
        }, 1000);
      } else {
        state.status = 'mining';
        if (statusEl) statusEl.innerHTML = `Starting Mining...`;
        startTreeMiningTimer(index, treeName, totalDurationSec);
      }
    }

    function startTreeMiningTimer(index, treeName, totalDurationSec) {
      let btn = document.getElementById(`treeBtn-${index}`);
      let statusEl = document.getElementById(`treeStatus-${index}`);
      let iconEl = document.getElementById(`treeIcon-${index}`);
      let progFill = document.getElementById(`treeProg-${index}`);

      if (btn) btn.disabled = true;
      let timeLeft = totalDurationSec;
      if (iconEl) iconEl.innerText = "🌿"; 

      let timer = setInterval(() => {
        timeLeft--;
        let elapsed = totalDurationSec - timeLeft;
        let percent = (elapsed / totalDurationSec) * 100;
        if (progFill) progFill.style.width = `${percent}%`;

        let hoursLeft = Math.floor(timeLeft / 3600);
        let minsLeft = Math.floor((timeLeft % 3600) / 60);

        if (percent > 75) {
          if (iconEl) iconEl.innerText = "🌳🍎"; 
          if (statusEl) statusEl.innerHTML = `🍎 Almost Ready`;
        } else {
          if (iconEl) iconEl.innerText = "🌳"; 
          if (statusEl) statusEl.innerHTML = `⏳ Mining: ${hoursLeft}h ${minsLeft}m`;
        }

        if (timeLeft <= 0) {
          clearInterval(timer);
          if (iconEl) iconEl.innerText = "✨🌳✨";
          if (statusEl) statusEl.innerHTML = `🎉 Ready to Claim!`;
          treeStates[index].status = 'claim';
          if (btn) {
            btn.innerText = "🎁 Claim 1 Coin";
            btn.style.background = "#eab308";
            btn.style.color = "#000";
            btn.disabled = false;
          }
        }
      }, 1000);
    }

    function claimTreeReward(index, treeName, totalDurationSec) {
      addEarningsWithReferral(1.00);
      let btn = document.getElementById(`treeBtn-${index}`);
      let statusEl = document.getElementById(`treeStatus-${index}`);
      let iconEl = document.getElementById(`treeIcon-${index}`);
      let progFill = document.getElementById(`treeProg-${index}`);

      treeStates[index] = { adsWatched: 0, limit: 20, status: 'ads' };
      let limitElId = [`pineLimit`, `appleLimit`, `sakuraLimit`, `crystalLimit`][index];
      let limitEl = document.getElementById(limitElId);
      if (limitEl) limitEl.innerText = `20 left`;

      if (progFill) progFill.style.width = "0%";
      if (iconEl) iconEl.innerText = "🌱";
      if (statusEl) statusEl.innerHTML = `Watch 20 Ads to Start`;
      if (btn) {
        btn.innerText = "Watch Ad (1/20)";
        btn.style.background = "#22c55e";
        btn.style.color = "#fff";
      }
      alert(`🎉 Success! You claimed +1.00 Coin from ${treeName}!`);
    }

    window.calculateStakeRewards = function() {
      let inputEl = document.getElementById('stakeCalcInput');
      let planEl = document.getElementById('stakeCalcPlan');
      if (!inputEl || !planEl) return;
      let coins = parseFloat(inputEl.value) || 0;
      let planVal = planEl.value.split('|');
      let days = parseInt(planVal[0]);
      let apy = parseFloat(planVal[1]);
      
      let totalRev = (coins * (apy / 100) * (days === 0 ? 1 : days / 365));
      let dailyRev = days > 0 ? totalRev / days : totalRev / 365;
      
      let prevDaily = document.getElementById('previewDaily');
      let prevTotal = document.getElementById('previewTotal');
      if (prevDaily) prevDaily.innerText = `${dailyRev.toFixed(4)} Coin`;
      if (prevTotal) prevTotal.innerText = `${totalRev.toFixed(4)} Coin`;
    }

    window.calculateExchange = function() {
      let amtEl = document.getElementById('exchangeAmount');
      let currEl = document.getElementById('exchangeCurrency');
      if (!amtEl || !currEl) return;
      let amt = parseFloat(amtEl.value) || 0;
      let curr = currEl.value;
      let totalUsdtValue = amt * coinUsdtValue; 
      
      let prevEx = document.getElementById('previewExchange');
      if (!prevEx) return;

      if(curr === 'USDT') {
        prevEx.innerText = `${totalUsdtValue.toFixed(4)} USDT`;
      } else {
        let tonReceived = totalUsdtValue / liveTonPrice; 
        prevEx.innerText = `${tonReceived.toFixed(4)} TON (Worth $${totalUsdtValue.toFixed(2)})`;
      }
    }

    window.exchangeCoins = function() {
      let amtEl = document.getElementById('exchangeAmount');
      let currEl = document.getElementById('exchangeCurrency');
      if (!amtEl || !currEl) return;
      let amt = parseFloat(amtEl.value);
      let curr = currEl.value;
      if(!amt || isNaN(amt) || amt <= 0) { alert("Please enter a valid amount."); return; }
      if(balance < amt) { alert("Insufficient coin balance!"); return; }

      balance -= amt;
      let totalUsdtValue = amt * coinUsdtValue;

      if(curr === 'TON') {
        let tonReceived = totalUsdtValue / liveTonPrice;
        tonBalance += tonReceived;
        alert(`Successfully exchanged for ${tonReceived.toFixed(4)} TON!`);
      } else {
        usdtBalance += totalUsdtValue;
        alert(`Successfully exchanged for ${totalUsdtValue.toFixed(4)} USDT!`);
      }
      saveToFirebase();
      renderUIValues();
      calculateExchange();
    }

    window.toggleWithdrawFields = function() {
      let methodEl = document.getElementById('withdrawMethod');
      let headerTitle = document.getElementById('withdrawHeaderTitle');
      let label = document.getElementById('addressLabel');
      let input = document.getElementById('withdrawDestination');
      let amountLabel = document.getElementById('withdrawAmountLabel');
      let minLabel = document.getElementById('withdrawMinLabel');
      
      if (!methodEl || !headerTitle || !label || !input) return;
      let method = methodEl.value;

      if(method === 'ton') {
        headerTitle.innerText = "⚡ TON Wallet Payout (Manual - 24 Hours Processing)";
        label.innerText = "Saved TON Wallet Address:";
        if (amountLabel) amountLabel.innerText = "Amount (TON):";
        if (minLabel) minLabel.innerText = `Min ${minWithdrawalAmt} TON`;
        if (savedTonAddress) {
          input.value = savedTonAddress;
          input.readOnly = true;
        } else {
          input.value = "";
          input.placeholder = "Pehle upar address save karein";
          input.readOnly = true;
        }
      } else {
        headerTitle.innerText = "⚡ FaucetPay instant (USDT)";
        label.innerText = "FaucetPay Email ID:";
        input.placeholder = "Enter FaucetPay email address";
        input.readOnly = false;
        input.value = "";
        if (amountLabel) amountLabel.innerText = "Amount (USDT):";
        if (minLabel) minLabel.innerText = `Min ${minWithdrawalAmt} USDT`;
      }
      renderUIValues();
    }

    window.setMaxWithdraw = function() {
      let methodEl = document.getElementById('withdrawMethod');
      let amtInput = document.getElementById('withdrawAmount');
      if (!methodEl || !amtInput) return;
      let method = methodEl.value;
      let maxVal = (method === 'ton') ? tonBalance : usdtBalance;
      amtInput.value = maxVal.toFixed(4);
      calculateWithdrawFee();
    }

    window.calculateWithdrawFee = function() {
      let amtInput = document.getElementById('withdrawAmount');
      let feePrev = document.getElementById('withdrawFeePreview');
      if (!amtInput || !feePrev) return;
      let amt = parseFloat(amtInput.value) || 0;
      let fee = amt * 0.05;
      let netReceive = amt - fee;
      feePrev.innerText = `Fee (5%): ${fee.toFixed(4)} | You will receive: ${netReceive.toFixed(4)}`;
    }

    window.requestWithdrawal = async function() {
      let amtInput = document.getElementById('withdrawAmount');
      let destInput = document.getElementById('withdrawDestination');
      let methodEl = document.getElementById('withdrawMethod');
      if (!amtInput || !destInput || !methodEl) return;

      let rawAmt = parseFloat(amtInput.value);
      let dest = destInput.value;
      let method = methodEl.value;

      if(!rawAmt || isNaN(rawAmt) || rawAmt < minWithdrawalAmt) { 
        alert(`Minimum withdrawal limit is ${minWithdrawalAmt}.`); 
        return; 
      }
      
      let fee = rawAmt * 0.05;
      let finalReceiveAmt = rawAmt - fee; 

      if (method === 'faucetpay') {
        if(!dest) { alert("Please enter FaucetPay email address."); return; }
        if(parseFloat(usdtBalance.toFixed(4)) < parseFloat(rawAmt.toFixed(4))) { 
          alert("Insufficient USDT balance for withdrawal!"); 
          return; 
        }

        alert("Processing automated FaucetPay payout...");
        try {
          let response = await fetch('https://gramfarming-api.onrender.com/api/withdraw-faucetpay', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: dest, amount: finalReceiveAmt, currency: 'USDT' })
          });
          let result = await response.json();

          if (result.success) {
            usdtBalance -= rawAmt;
            saveToFirebase();
            renderUIValues();
            recordTransactionHistory(`FaucetPay: ${finalReceiveAmt.toFixed(4)} USDT to ${dest}`);
            alert(`⚡ FaucetPay Success! ${finalReceiveAmt.toFixed(4)} USDT sent to ${dest}.`);
          } else {
            alert(`Payout Failed: ${result.message}`);
          }
        } catch (err) {
          alert("Network error while connecting to FaucetPay API server.");
        }
      } else {
        if(parseFloat(tonBalance.toFixed(4)) < parseFloat(rawAmt.toFixed(4))) { 
          alert("Insufficient TON balance!"); 
          return; 
        }
        if(!savedTonAddress) { alert("Pehle apna TON wallet address save karein!"); return; }

        alert("Processing TON withdrawal request...");
        try {
          let withdrawRef = push(ref(db, 'withdrawals'));
          await set(withdrawRef, {
            userId: userId,
            userName: displayName,
            method: 'TON',
            amount: finalReceiveAmt,
            destination: savedTonAddress,
            status: 'Pending (24 Hours Processing)',
            timestamp: serverTimestamp()
          });

          tonBalance -= rawAmt;
          saveToFirebase();
          renderUIValues();
          recordTransactionHistory(`TON Withdrawal (Processing 24h): ${finalReceiveAmt.toFixed(4)} TON to ${savedTonAddress}`);
          alert(`🎉 TON Withdrawal Request Successful! Admin panel par update ho gaya hai.`);
        } catch (err) {
          alert("Error while processing withdrawal request to Firebase.");
        }
      }
    }

    function recordTransactionHistory(details) {
      let historyList = document.getElementById('transactionHistoryList');
      if (!historyList) return;
      let timeStr = new Date().toLocaleTimeString();
      let newItem = `<div style="padding: 6px 0; border-bottom: 1px solid var(--border); width: 100%;">✅ [${timeStr}] ${details}</div>`;
      if(historyList.innerText.includes("No recent withdrawals")) {
        historyList.innerHTML = newItem;
      } else {
        historyList.innerHTML = newItem + historyList.innerHTML;
      }
    }

    window.loadTransactionHistory = function() {}

    window.addNewTask = function() { 
      let titleInput = document.getElementById('customTaskTitle');
      let linkInput = document.getElementById('customTaskLink');
      if (!titleInput || !linkInput) return;
