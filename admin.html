<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gram Farming Admin Panel</title>
    <style>
        body { background: #0f172a; color: #f8fafc; font-family: sans-serif; padding: 15px; margin: 0; }
        .container { max-width: 700px; margin: 0 auto; }
        .card { background: #1e293b; padding: 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #334155; }
        input { background: #0f172a; border: 1px solid #334155; color: #fff; padding: 10px; border-radius: 6px; width: 100%; margin-top: 4px; margin-bottom: 12px; box-sizing: border-box; }
        label { font-size: 13px; color: #94a3b8; display: block; margin-bottom: 5px; }
        button { background: #22c55e; color: #fff; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; font-size: 15px; }
        .btn-success { background: #10b981; padding: 6px 12px; width: auto; font-size: 13px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        h2 { color: #22c55e; margin-top: 0; font-size: 18px; border-bottom: 1px solid #334155; padding-bottom: 8px; }
        h1 { font-size: 20px; text-align: center; color: #f8fafc; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
        th, td { border: 1px solid #334155; padding: 8px; text-align: left; color: #f8fafc; }
        th { background: #0f172a; color: #38bdf8; }
        .table-container { overflow-x: auto; }
    </style>
</head>
<body>

<div class="container">
    <h1>⚙️ Gram Farming Admin Panel</h1>
    
    <!-- General Settings -->
    <div class="card">
        <h2>🌐 General Settings</h2>
        <div class="grid-2">
            <div>
                <label>Coin USDT Value ($):</label>
                <input type="number" id="coinUsdtValue" step="0.001" value="0.01">
            </div>
            <div>
                <label>Daily Bonus Reward (Coins):</label>
                <input type="number" id="dailyBonus" step="0.01" value="2.00">
            </div>
            <div>
                <label>Referral Bonus (%):</label>
                <input type="number" id="refBonus" step="0.1" value="20">
            </div>
            <div>
                <label>Min. Withdrawal Limit:</label>
                <input type="number" id="minWithdrawal" step="0.01" value="0.05">
            </div>
        </div>
        <button type="button" onclick="saveSettings()">💾 Save Changes to Firebase</button>
    </div>

    <!-- Withdrawals Management -->
    <div class="card">
        <h2>💸 Withdrawal Requests</h2>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>User ID</th>
                        <th>Amount</th>
                        <th>Wallet</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="withdrawalsTableBody">
                    <tr><td colspan="4" style="text-align: center;">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Users List -->
    <div class="card">
        <h2>👥 Users & Staking Details</h2>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>User Details</th>
                        <th>Referrals</th>
                        <th>Staking Info</th>
                    </tr>
                </thead>
                <tbody id="usersTableBody">
                    <tr><td colspan="3" style="text-align: center;">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, get, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCx2g_tueJ0tqghMMlh4z20ltA_UlLe_Hg", 
        authDomain: "gramfarmingbot-1a570.firebaseapp.com",
        databaseURL: "https://gramfarmingbot-1a570-default-rtdb.firebaseio.com",
        projectId: "gramfarmingbot-1a570",
        storageBucket: "gramfarmingbot-1a570.firebasestorage.app",
        messagingSenderId: "113291680927",
        appId: "1:113291680927:web:cb20c9f6b7914a546156aa" 
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    window.addEventListener('DOMContentLoaded', () => {
        // Load Settings
        get(ref(db, 'adminSettings/general')).then((snapshot) => {
            if (snapshot.exists()) {
                const data = snapshot.val();
                document.getElementById('coinUsdtValue').value = data.coinUsdtValue ?? 0.01;
                document.getElementById('dailyBonus').value = data.dailyBonus ?? 2.00;
                document.getElementById('refBonus').value = data.refBonus ?? 20;
                document.getElementById('minWithdrawal').value = data.minWithdrawal ?? 0.05;
            }
        }).catch((error) => console.error("Error loading settings:", error));

        // Load Withdrawals
        get(ref(db, 'withdrawals')).then((snapshot) => {
            const tbody = document.getElementById('withdrawalsTableBody');
            tbody.innerHTML = '';
            if (snapshot.exists()) {
                snapshot.forEach((childSnapshot) => {
                    const id = childSnapshot.key;
                    const w = childSnapshot.val();
                    const statusText = w.status === 'Successful ✅' ? '<span style="color:#22c55e;">Successful ✅</span>' : `<button class="btn-success" onclick="markSuccess('${id}')">Approve ✅</button>`;
                    tbody.innerHTML += `<tr><td>${w.userId || 'N/A'}</td><td>${w.amount}</td><td>${w.walletDetails || 'N/A'}</td><td>${statusText}</td></tr>`;
                });
            } else {
                tbody.innerHTML = `<tr><td colspan="4" style="text-align: center;">No requests found.</td></tr>`;
            }
        });

        // Load Users
        get(ref(db, 'users')).then((snapshot) => {
            const tbody = document.getElementById('usersTableBody');
            tbody.innerHTML = '';
            if (snapshot.exists()) {
                snapshot.forEach((childSnapshot) => {
                    const u = childSnapshot.val();
                    const refCount = u.referrals ? Object.keys(u.referrals).length : 0;
                    tbody.innerHTML += `<tr><td>${u.name || u.username || childSnapshot.key}</td><td>👥 ${refCount}</td><td>💎 ${u.staking ? 'Active' : 'None'}</td></tr>`;
                });
            } else {
                tbody.innerHTML = `<tr><td colspan="3" style="text-align: center;">No users found.</td></tr>`;
            }
        });
    });

    window.markSuccess = function(withdrawId) {
        update(ref(db, 'withdrawals/' + withdrawId), { status: 'Successful ✅' })
            .then(() => { alert('Approved!'); location.reload(); })
            .catch((error) => alert('Error: ' + error.message));
    };

    window.saveSettings = function() {
        const settingsData = {
            coinUsdtValue: parseFloat(document.getElementById('coinUsdtValue').value),
            dailyBonus: parseFloat(document.getElementById('dailyBonus').value),
            refBonus: parseFloat(document.getElementById('refBonus').value),
            minWithdrawal: parseFloat(document.getElementById('minWithdrawal').value)
        };

        set(ref(db, 'adminSettings/general'), settingsData)
            .then(() => {
                alert('Settings Saved Successfully! 🚀');
            })
            .catch((error) => {
                alert('Firebase Save Error: ' + error.message);
            });
    };
</script>

</body>
</html>
